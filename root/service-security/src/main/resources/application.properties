spring.application.name=service-security

server.port=9100

spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=superstore
spring.datasource.password=superstore
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

jwt.private-key-location=file:c:/project/superstore/keys/private.pem
jwt.expiration-ms=86400000

# tells this service where the Eureka registry lives.
eureka.client.service-url.defaultZone=http://eureka:eureka@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# keep registration enabled so it connects when Eureka comes online.
# eureka.client.enabled=false
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true