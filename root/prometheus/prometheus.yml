global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # 15s is only the interval for each Prometheus target, not a global limit.
  # if both targets resolve to the running product service, Prometheus scrapes it twice every 15 seconds.

scrape_configs:
  - job_name: "service-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      # cmd: prometheus --config.file=./prometheus.yml
      # - targets: ["host.docker.internal:9000"]
      - targets: 
          # - gateway:9000 [OR] "host.docker.internal:9000"          
          - "host.docker.internal:9000"
          - "localhost:9000"

  - job_name: "service-security"
    metrics_path: "/actuator/prometheus"
    static_configs:
      # - targets: ["host.docker.internal:9100"]
      - targets: 
          # - service-security:9100 [OR] "host.docker.internal:9100"
          - "host.docker.internal:9100"
          - "localhost:9100"

  - job_name: "service-product"
    metrics_path: "/actuator/prometheus"
    static_configs:
      # - targets: ["host.docker.internal:8081"]
      - targets: 
          - "host.docker.internal:8081"
          - "localhost:8081"

  - job_name: "service-order"
    metrics_path: "/actuator/prometheus"
    static_configs:
      # - targets: ["host.docker.internal:8082"]
      - targets: 
          - "host.docker.internal:8082"
          - "localhost:8082"

  - job_name: "service-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      # - targets: ["host.docker.internal:8080"]
      - targets: 
          - "host.docker.internal:8080"
          - "localhost:8080"