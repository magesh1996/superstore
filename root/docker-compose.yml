      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-security:
        condition: service_started
    # by default, Docker only checks if a container is started (service_started), 
    # which just means the process kicked off, not that (service_healthy) the database inside it is actually ready for queries.

