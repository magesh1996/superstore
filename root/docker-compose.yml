  #     APP_USER_PASSWORD: superstore
  #   ports:
  #     - "1522:1521"
  #   volumes:
  #     - oracle-data:/opt/oracle/oradata
  #   healthcheck:
  #     test: ["CMD", "healthcheck.sh"]
