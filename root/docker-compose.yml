# docker compose up --build
#
# hostnames below are resolved by Docker's internal DNS using the 
# container/service names (eureka, gateway, postgres, oracle, redis, kafka). 
# none of this requires editing your application.properties files,
# every value here overrides the equivalent "localhost" default from 
# application.properties via Spring Boot's relaxed environment-variable binding 
# (EXAMPLE : SPRING_DATASOURCE_URL overrides spring.datasource.url).

services:

  # ---------------------------------------------------------------------
  # infrastructure
  # ---------------------------------------------------------------------

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: superstore-oracle
    environment:
      ORACLE_PASSWORD: superstore          # SYS/SYSTEM password
      APP_USER: superstore                 # auto-creates the schema/user the apps use
      APP_USER_PASSWORD: superstore
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: superstore-postgres
    environment:
      POSTGRES_DB: superstore
      POSTGRES_USER: superstore
      POSTGRES_PASSWORD: superstore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superstore -d superstore"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: superstore-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: superstore-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: superstore-kraft-cluster-1

  # ---------------------------------------------------------------------
  # application services
  # ---------------------------------------------------------------------

  eureka:
    build:
      context: .
      dockerfile: service-eureka/Dockerfile
    container_name: superstore-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://eureka:eureka@localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    build:
      context: .
      dockerfile: service-gateway/Dockerfile
    container_name: superstore-gateway
    environment:
      EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE: http://eureka:eureka@eureka:8761/eureka/
    ports:
      - "9000:9000"
    depends_on:
      eureka:
        condition: service_healthy

  service-product:
    build:
      context: .
      dockerfile: service-product/Dockerfile
    container_name: superstore-service-product
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/superstore
      SPRING_DATASOURCE_USERNAME: superstore
      SPRING_DATASOURCE_PASSWORD: superstore
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP-SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE: http://eureka:eureka@eureka:8761/eureka/
    ports:
      - "8081:8081"
    depends_on:
      eureka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    # by default, Docker only checks if a container is started (service_started), 
    # which just means the process kicked off, not that (service_healthy) the database inside it is actually ready for queries.

  service-order:
    build:
      context: .
      dockerfile: service-order/Dockerfile
    container_name: superstore-service-order
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: superstore
      SPRING_DATASOURCE_PASSWORD: superstore
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP-SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE: http://eureka:eureka@eureka:8761/eureka/
    ports:
      - "8082:8082"
    depends_on:
      eureka:
        condition: service_healthy
      oracle:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  service-app:
    build:
      context: .
      dockerfile: service-app/Dockerfile
    container_name: superstore-service-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: superstore
      SPRING_DATASOURCE_PASSWORD: superstore
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      BACKEND_GATEWAY-URL: http://gateway:9000
    ports:
      - "8080:8080"
    depends_on:
      oracle:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_started

volumes:
  oracle-data:
  postgres-data:
