  postgres:
    # image: postgres:16-alpine
    image: pgvector/pgvector:pg16
    # container_name: superstore-postgres
    environment:
      # POSTGRES_DB: superstore
      # POSTGRES_USER: superstore
      # POSTGRES_PASSWORD: superstore
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # - "5433:5432"
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init/01-create-schema.sql:/docker-entrypoint-initdb.d/01-create-schema.sql:ro
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1G
    #     reservations:
    #       memory: 512M
    healthcheck:
      # test: ["CMD-SHELL", "pg_isready -U superstore -d superstore"]
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # container_name: superstore-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
    #     reservations:
    #       memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.8.0
    # container_name: superstore-kafka
    # Kafka is actually binding to three distinct internal ports inside the container:
    # 9092: PLAINTEXT listener (used for internal Docker communication between microservices).
    # 9093: CONTROLLER listener (used internally by KRaft for consensus management).
    # 9094: EXTERNAL listener (used for external connections from your host machine).
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: superstore-kraft-cluster-1
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-logs:/tmp/kraft-combined-logs
      - kafka-secrets:/etc/kafka/secrets
      - kafka-config:/mnt/shared/config
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2G
    #     reservations:
    #       memory: 1G
    depends_on:
      redis:
        condition: service_healthy
  
  akhq:
    image: tchiotludo/akhq:latest
    # container_name: superstore-akhq
    profiles: ["tools"]
    # port conflicts only happen if two containers try to map to the same port on the host machine.
    # inside Docker's internal network: every service gets its own unique IP address and hostname.
    # service-app listens on service-app:8080
    # akhq listens on akhq:8080
    # because they have separate internal hostnames/IPs, their internal ports do not touch or collide.
    ports:
      - "8090:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka:
              properties:
                bootstrap.servers: "kafka:9092"
    volumes:
      - akhq-data:/app/store
    # healthcheck:
    #   test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy

