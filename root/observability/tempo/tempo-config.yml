server:
  # the main HTTP port where Tempo listens for API requests, health checks, and queries (Grafana connects here).
  http_listen_port: 3200

# the component that accepts incoming traces from your applications.
distributor:
  # tells Tempo to accept data using the native OpenTelemetry Protocol (OTLP).
  receivers:
    otlp:
      # enables ingestion over both OTLP gRPC (standard port 4317) and OTLP HTTP (4318), 
      # allowing any OpenTelemetry-instrumented microservice to send traces directly here.
      protocols:
        grpc:
        http:

storage:
  trace:
    # saves trace blocks directly to a local directory on disk rather than a cloud object store (like S3 or GCS).
    backend: local
    local:
      path: /var/tempo/traces

compactor:
  compaction:
    # automatically deletes trace data older than 168 hours (7 days) to manage disk space.
    block_retention: 168h

# a powerful built-in engine that reads incoming trace spans in real-time and turns them into metrics.
metrics_generator:
  # tags any metrics generated by Tempo with (source: tempo) so you can identify them in Prometheus.
  registry:
    external_labels:
      source: tempo
  # uses a Write-Ahead Log (WAL) locally to temporarily buffer data for the generator.
  storage:
    path: /var/tempo/generator/wal
  # instructs Tempo to automatically calculate service graphs (visual maps of how your microservices talk to each other) 
  # and span metrics (RED metrics: Rate, Errors, Duration for every operation) directly from the trace stream.
  processor:
    service_graphs:
    span_metrics:

# forces the service-graphs and span-metrics processors to be turned on by default for all incoming data streams without needing tenant-specific rules.
overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics