# CIRCUIT BREAKER CONFIGURATION: the Circuit Breaker prevents a cascading failure when calling the service by failing fast when errors threshold is breached.
# tells the circuit breaker to evaluate failure rates based on a fixed number of requests 
# rather than a time window (e.g., last 10 seconds).
resilience4j.circuitbreaker.instances.productService.sliding-window-type=COUNT_BASED
# sets the size of the request window to 10 calls. 
# the circuit breaker will record and track the outcome of the last 10 requests to evaluate health.
resilience4j.circuitbreaker.instances.productService.sliding-window-size=10
# defines the failure rate percentage, if 50% or more of the requests in the sliding window fail (e.g., 5 out of 10), 
# the circuit breaker switches to the OPEN state and blocks further calls to the service.
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
# sets how long the circuit breaker stays in the OPEN state. 
# it will block all incoming requests immediately for 10 seconds before transitioning to HALF-OPEN to test if the service has recovered.
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s
# once the 10-second wait time expires, the circuit enters HALF-OPEN state. 
# it allows 3 trial requests to pass through.
# if these 3 calls succeed, the circuit returns to CLOSED (normal operation).
# if any fail and breach the threshold, it goes back to OPEN for another 10 seconds.
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=3
# specifies which Java exceptions count as failures towards the 50% threshold. 
# setting this to java.lang.Exception means any checked or unchecked exception thrown by the call will be treated as a failure.
resilience4j.circuitbreaker.instances.productService.record-exceptions=java.lang.Exception

resilience4j.circuitbreaker.instances.orderService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.orderService.sliding-window-size=10
resilience4j.circuitbreaker.instances.orderService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orderService.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.chatbotService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.chatbotService.sliding-window-size=5
resilience4j.circuitbreaker.instances.chatbotService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.chatbotService.wait-duration-in-open-state=30s

# RATE LIMITER CONFIGURATION: the Rate Limiter controls the frequency of incoming requests to protect the endpoint/service from spam or overuse.
# sets the maximum allowance to 5 requests per refresh period.
resilience4j.ratelimiter.instances.chatbotRequests.limit-for-period=5
# sets the duration of the rate limit window to 1 minute.
# combined with the above limit-for-period, users/clients can make up to 5 requests per 1 minute.
resilience4j.ratelimiter.instances.chatbotRequests.limit-refresh-period=1m
# defines how long a thread should wait/block for permission if the limit (5 requests) has already been reached. 
# setting this to 0s means it will fail instantly (throwing a RequestNotPermitted exception) rather than waiting for the rate limit window to reset.
resilience4j.ratelimiter.instances.chatbotRequests.timeout-duration=0s
